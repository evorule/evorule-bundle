# Release workflow for EvoRule Bundle (快照包模型 crate)
#
# 触发: 推送 v* tag。纯 lib crate,无二进制产物——
# Release 内容 = 测试验证 + GitHub Release(tag 注记)。
# gitee 侧 Release 由 gitee 自动链提供源码包,无需额外回传。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --generate-notes
